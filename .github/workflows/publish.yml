name: Publish to PyPI

# Build always runs. Upload runs on release (or workflow_dispatch with dry_run=false).
# Uses pypa/gh-action-pypi-publish for OIDC trusted publishing (pending publisher OK).
# Fallback: repository secret PYPI_TOKEN.
#
# PyPI project name: personanexus-agentforge
# Pending publisher must match:
#   Owner: PersonaNexus | Repo: agentforge | Workflow: publish.yml | Env: pypi

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only (do not upload to PyPI)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    # OIDC for trusted publishing
    permissions:
      contents: read
      id-token: write
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI (trusted publishing / token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # If PYPI_TOKEN is set, password auth is used; otherwise OIDC.
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist/
          verbose: true
          # print-hash: true
