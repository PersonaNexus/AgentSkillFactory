name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    name: Core quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install core dev dependencies
        run: uv sync --dev

      - name: Run core test suite
        run: uv run pytest -q

      - name: Run calibrated Ruff gate
        run: uv run ruff check src/agentforge/web/__init__.py tests/test_cli_stability.py

      - name: Run calibrated mypy gate
        run: >-
          uv run mypy --follow-imports=skip --ignore-missing-imports
          src/agentforge/utils.py src/agentforge/pipeline/forge_pipeline.py

      - name: Build package
        run: uv run --with build python -m build
